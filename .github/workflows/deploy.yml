name: github pages

on:
  push:
    branches:
    - source
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0  # full history for enableGitInfo (per-page lastmod)

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        # Pinned so a new Hugo release can't break deploys; bump deliberately after testing locally.
        hugo-version: '0.167.0'
        # extended: true

    - name: Build
      run: hugo --minify

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: master
